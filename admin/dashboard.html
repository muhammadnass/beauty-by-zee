<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Beauty by Zee</title>
  <link rel="icon" href="../images/icon-32.png">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    .supabase-status {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; padding: 0.3rem 0.8rem;
      border-radius: 20px; font-weight: 600;
    }
    .status-local { background:#fff3cd;color:#856404; }
    .status-cloud { background:#d4edda;color:#155724; }
    .status-dot   { width:8px;height:8px;border-radius:50%;background:currentColor; }

    /* TABS */
    .admin-tabs { display:flex;gap:0;border-bottom:2px solid rgba(201,168,76,0.3);margin-bottom:1.5rem; }
    .admin-tab {
      padding:0.75rem 1.4rem;cursor:pointer;font-weight:600;font-size:0.9rem;
      color:var(--text-light);border:none;background:none;
      border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.2s;
    }
    .admin-tab.active { color:var(--gold-dark);border-bottom-color:var(--gold-dark); }
    .admin-tab:hover:not(.active) { color:var(--brown); }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    /* PRODUCT MANAGE CARDS */
    .manage-grid { display:flex;flex-direction:column;gap:0.8rem; }
    .manage-card {
      display:flex;align-items:center;gap:1rem;
      background:#fff;border:1px solid rgba(201,168,76,0.2);
      border-radius:12px;padding:0.8rem 1rem;
    }
    .manage-card img {
      width:68px;height:68px;object-fit:cover;border-radius:8px;flex-shrink:0;
      background:#f0e8d8;
    }
    .manage-card .mc-info { flex:1;min-width:0; }
    .manage-card .mc-name { font-weight:700;font-size:0.9rem;color:var(--brown); }
    .manage-card .mc-meta { font-size:0.75rem;color:var(--text-light);margin-top:0.15rem; }
    .manage-card .mc-price { font-size:0.82rem;font-weight:700;color:var(--gold-dark);margin-top:0.2rem; }
    .mc-actions { display:flex;flex-direction:column;gap:0.4rem;flex-shrink:0; }
    .btn-edit {
      background:#fff8e8;border:1px solid rgba(201,168,76,0.4);color:var(--brown);
      border-radius:7px;padding:0.35rem 0.7rem;font-size:0.78rem;cursor:pointer;font-weight:600;
    }
    .btn-edit:hover { background:#fdf0d0; }
    .btn-del {
      background:#fff0f0;border:1px solid #ffcccc;color:#c0392b;
      border-radius:7px;padding:0.35rem 0.7rem;font-size:0.78rem;cursor:pointer;font-weight:600;
    }
    .btn-del:hover { background:#ffe0e0; }
    .default-tag {
      font-size:0.65rem;background:rgba(201,168,76,0.15);color:var(--gold-dark);
      border-radius:4px;padding:0.1rem 0.4rem;font-weight:600;margin-left:0.4rem;
    }

    /* EDIT MODAL */
    .edit-modal-overlay {
      position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;
      display:none;align-items:center;justify-content:center;padding:1rem;
    }
    .edit-modal-overlay.open { display:flex; }
    .edit-modal {
      background:#fff;border-radius:16px;padding:1.5rem;width:100%;max-width:520px;
      max-height:90vh;overflow-y:auto;
    }
    .edit-modal h3 {
      font-family:'Playfair Display',serif;color:var(--brown);
      margin-bottom:1.2rem;font-size:1.1rem;
    }
    .form-field { display:flex;flex-direction:column;gap:0.3rem;margin-bottom:0.9rem; }
    .form-field label { font-size:0.8rem;font-weight:600;color:var(--text-light); }
    .form-field input,.form-field select,.form-field textarea {
      padding:0.6rem 0.9rem;border:1.5px solid rgba(201,168,76,0.3);
      border-radius:8px;font-size:0.9rem;color:var(--brown);background:#fdf6ec;
      transition:border 0.2s;font-family:inherit;width:100%;box-sizing:border-box;
    }
    .form-field input:focus,.form-field select:focus,.form-field textarea:focus {
      outline:none;border-color:var(--gold-dark);
    }
    .form-field textarea { resize:vertical;min-height:70px; }
    .form-row { display:grid;grid-template-columns:1fr 1fr;gap:1rem; }
    @media(max-width:500px){.form-row{grid-template-columns:1fr;}}

    /* image upload in modal */
    .upload-area {
      border:2px dashed rgba(201,168,76,0.4);border-radius:12px;padding:1rem;
      text-align:center;cursor:pointer;transition:all 0.2s;background:#fdf6ec;position:relative;
    }
    .upload-area:hover,.upload-area.drag-over{border-color:var(--gold-dark);background:#fdf0d8;}
    .upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
    .upload-preview{width:100%;max-height:160px;object-fit:cover;border-radius:8px;display:none;margin-top:0.6rem;}
    .upload-progress{height:4px;background:rgba(201,168,76,0.2);border-radius:2px;margin-top:0.6rem;display:none;overflow:hidden;}
    .upload-progress-bar{height:100%;background:var(--gold-dark);border-radius:2px;transition:width 0.3s;width:0%;}
    .upload-status{font-size:0.78rem;margin-top:0.3rem;display:none;}

    .modal-btns { display:flex;gap:0.8rem;margin-top:1rem; }
    .btn-save-edit {
      flex:1;background:linear-gradient(135deg,var(--gold-dark),#e8c97a);
      color:#fff;border:none;padding:0.75rem 1rem;border-radius:25px;
      font-weight:700;font-size:0.95rem;cursor:pointer;
    }
    .btn-save-edit:disabled{opacity:0.5;cursor:not-allowed;}
    .btn-cancel-edit {
      flex:0 0 auto;background:#f5f5f5;border:none;padding:0.75rem 1.2rem;
      border-radius:25px;font-weight:600;font-size:0.9rem;cursor:pointer;color:#666;
    }

    /* ADD PRODUCT FORM */
    .add-product-form {
      background:#fff;border:1px solid rgba(201,168,76,0.25);
      border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;
    }
    .add-product-form h3 {
      font-family:'Playfair Display',serif;color:var(--brown);
      margin-bottom:1.2rem;font-size:1.1rem;
    }
    .btn-add-product {
      background:linear-gradient(135deg,var(--gold-dark),#e8c97a);
      color:#fff;border:none;padding:0.75rem 2rem;
      border-radius:25px;font-weight:700;font-size:0.95rem;
      cursor:pointer;transition:opacity 0.2s;width:100%;margin-top:0.5rem;
    }
    .btn-add-product:hover{opacity:0.9;}
    .btn-add-product:disabled{opacity:0.5;cursor:not-allowed;}

    .admin-saved-msg {
      padding:0.8rem 1rem;border-radius:10px;margin-bottom:1rem;
      display:none;font-size:0.9rem;font-weight:600;
    }
    .admin-dash-logo{display:flex;align-items:center;gap:0.8rem;}
    .admin-dash-logo img{width:42px;height:42px;border-radius:50%;object-fit:contain;}
  </style>
</head>
<body>

<div class="admin-dash">
  <div class="admin-topbar">
    <div class="admin-dash-logo" style="margin:0">
      <img src="../images/logo.jpg" alt="Logo">
      <span style="color:#c9a84c;font-size:1rem;font-family:'Playfair Display',serif">Admin Dashboard</span>
    </div>
    <div style="display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap">
      <span class="supabase-status" id="syncStatus"><span class="status-dot"></span> Loading...</span>
      <a href="../index.html" target="_blank" style="color:rgba(255,255,255,0.7);font-size:0.82rem;text-decoration:none">View Store ↗</a>
      <button class="admin-logout" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="admin-content">
    <div class="admin-title">Manage Store</div>
    <div id="savedMsg" class="admin-saved-msg"></div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="manage">🛍 All Products</button>
      <button class="admin-tab" data-tab="add">➕ Add Product</button>
    </div>

    <!-- ===== TAB: ALL PRODUCTS ===== -->
    <div class="tab-panel active" id="tab-manage">
      <div class="admin-subtitle" style="margin-bottom:1rem">
        Edit name, description, price, image or badge — or delete any product. Changes sync to all customers.
      </div>
      <div style="margin-bottom:1rem">
        <button class="save-btn" id="savePricesBtn">💾 Save All Prices</button>
      </div>
      <div class="manage-grid" id="manageGrid"></div>
    </div>

    <!-- ===== TAB: ADD PRODUCT ===== -->
    <div class="tab-panel" id="tab-add">
      <div class="add-product-form">
        <h3>➕ Add New Product</h3>
        <div class="form-row">
          <div class="form-field">
            <label>Product Name *</label>
            <input type="text" id="newName" placeholder="e.g. Rose Hip Oil">
          </div>
          <div class="form-field">
            <label>Category *</label>
            <select id="newCategory">
              <option value="">Select category…</option>
              <option>Face Care</option>
              <option>Body Care</option>
              <option>Natural Rituals</option>
              <option>Sets & Combos</option>
            </select>
          </div>
        </div>
        <div class="form-field">
          <label>Description</label>
          <textarea id="newDesc" placeholder="Short product description…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>Price (₦)</label>
            <input type="number" id="newPrice" placeholder="0" min="0" step="50">
          </div>
          <div class="form-field">
            <label>Badge (optional)</label>
            <input type="text" id="newBadge" placeholder="e.g. New, Bestseller">
          </div>
        </div>
        <div class="form-field">
          <label>Product Image *</label>
          <div class="upload-area" id="addUploadArea">
            <input type="file" id="addImageFile" accept="image/*">
            <div>📷</div>
            <p style="font-size:0.85rem;color:var(--text-light);margin:0.3rem 0 0">Click or drag & drop image</p>
            <p style="font-size:0.75rem;color:#aaa;margin:0.2rem 0 0">Auto-optimized via Cloudinary</p>
            <img class="upload-preview" id="addUploadPreview" alt="Preview">
            <div class="upload-progress" id="addUploadProgress"><div class="upload-progress-bar" id="addUploadBar"></div></div>
            <div class="upload-status" id="addUploadStatus"></div>
          </div>
        </div>
        <button class="btn-add-product" id="addProductBtn">➕ Add Product to Store</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== EDIT MODAL ===== -->
<div class="edit-modal-overlay" id="editModal">
  <div class="edit-modal">
    <h3 id="editModalTitle">✏️ Edit Product</h3>
    <input type="hidden" id="editId">
    <input type="hidden" id="editIsDefault">

    <div class="form-row">
      <div class="form-field">
        <label>Product Name *</label>
        <input type="text" id="editName" placeholder="Product name">
      </div>
      <div class="form-field">
        <label>Category *</label>
        <select id="editCategory">
          <option value="">Select…</option>
          <option>Face Care</option>
          <option>Body Care</option>
          <option>Natural Rituals</option>
          <option>Sets & Combos</option>
        </select>
      </div>
    </div>
    <div class="form-field">
      <label>Description</label>
      <textarea id="editDesc" placeholder="Description…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>Price (₦)</label>
        <input type="number" id="editPrice" placeholder="0" min="0" step="50">
      </div>
      <div class="form-field">
        <label>Badge (optional)</label>
        <input type="text" id="editBadge" placeholder="e.g. New">
      </div>
    </div>
    <div class="form-field">
      <label>Product Image (upload new to replace)</label>
      <div class="upload-area" id="editUploadArea">
        <input type="file" id="editImageFile" accept="image/*">
        <img id="editCurrentImg" style="width:100%;max-height:140px;object-fit:cover;border-radius:8px;display:block;margin-bottom:0.5rem" alt="Current image">
        <p style="font-size:0.8rem;color:var(--text-light);margin:0">Click to replace image</p>
        <div class="upload-progress" id="editUploadProgress"><div class="upload-progress-bar" id="editUploadBar"></div></div>
        <div class="upload-status" id="editUploadStatus"></div>
      </div>
    </div>

    <div class="modal-btns">
      <button class="btn-cancel-edit" onclick="closeEditModal()">Cancel</button>
      <button class="btn-save-edit" id="saveEditBtn">💾 Save Changes</button>
    </div>
  </div>
</div>

<script src="../data/products.js"></script>
<script src="../js/supabase.js"></script>
<script>
  if (localStorage.getItem('bbz_admin') !== 'true') window.location.href = 'login.html';
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('bbz_admin');
    window.location.href = 'login.html';
  });

  const statusEl = document.getElementById('syncStatus');
  if (SupabaseManager.isConfigured()) {
    statusEl.innerHTML = '<span class="status-dot"></span> ☁️ Cloud Sync Active';
    statusEl.className = 'supabase-status status-cloud';
  } else {
    statusEl.innerHTML = '<span class="status-dot"></span> Local Only';
    statusEl.className = 'supabase-status status-local';
  }

  // TABS
  document.querySelectorAll('.admin-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });

  let savedPrices = {};
  let customProducts = [];   // extra products added by admin
  let deletedDefaults = [];  // ids of default products hidden

  async function init() {
    [savedPrices, customProducts] = await Promise.all([
      SupabaseManager.loadPrices(),
      SupabaseManager.loadCustomProducts()
    ]);
    // load deleted defaults list
    try { deletedDefaults = JSON.parse(localStorage.getItem('bbz_deleted_defaults') || '[]'); } catch { deletedDefaults = []; }
    renderManageGrid();
  }

  // ===== ALL PRODUCTS GRID =====
  function allProducts() {
    const defaults = DEFAULT_PRODUCTS.filter(p => !deletedDefaults.includes(p.id));
    return [...defaults, ...customProducts];
  }

  function renderManageGrid() {
    const grid = document.getElementById('manageGrid');
    const products = allProducts();
    if (products.length === 0) {
      grid.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-light)">No products. Add some!</div>';
      return;
    }
    grid.innerHTML = products.map(p => {
      const isDefault = DEFAULT_PRODUCTS.some(d => d.id === p.id);
      const price = savedPrices[p.id] !== undefined ? savedPrices[p.id] : (p.price || 0);
      return `
      <div class="manage-card" id="mc-${p.id}">
        <img src="${p.image}" alt="${p.name}" onerror="this.src='../images/placeholder.jpg'">
        <div class="mc-info">
          <div class="mc-name">${p.name}${isDefault ? '<span class="default-tag">default</span>' : ''}</div>
          <div class="mc-meta">${p.category}${p.badge ? ' · ' + p.badge : ''}</div>
          <div class="mc-price">${price > 0 ? '₦' + Number(price).toLocaleString() : 'Price on request'}</div>
        </div>
        <div class="mc-actions">
          <button class="btn-edit" onclick="openEditModal(${p.id})">✏️ Edit</button>
          <button class="btn-del" onclick="deleteProduct(${p.id}, ${isDefault})">🗑 Delete</button>
        </div>
      </div>`;
    }).join('');
  }

  // Quick save all prices from price inputs (if shown)
  document.getElementById('savePricesBtn').addEventListener('click', async () => {
    const btn = document.getElementById('savePricesBtn');
    btn.textContent = '⏳ Saving…'; btn.disabled = true;
    const result = await SupabaseManager.savePrices(savedPrices);
    showMsg(result.ok, result.msg);
    btn.textContent = '💾 Save All Prices'; btn.disabled = false;
  });

  // ===== EDIT MODAL =====
  let editImageUrl = '';

  window.openEditModal = function(id) {
    const p = allProducts().find(x => x.id === id);
    if (!p) return;
    const price = savedPrices[p.id] !== undefined ? savedPrices[p.id] : (p.price || 0);
    const isDefault = DEFAULT_PRODUCTS.some(d => d.id === p.id);

    document.getElementById('editId').value = id;
    document.getElementById('editIsDefault').value = isDefault ? '1' : '0';
    document.getElementById('editModalTitle').textContent = '✏️ Edit: ' + p.name;
    document.getElementById('editName').value = p.name;
    document.getElementById('editCategory').value = p.category;
    document.getElementById('editDesc').value = p.description || '';
    document.getElementById('editPrice').value = price || '';
    document.getElementById('editBadge').value = p.badge || '';
    document.getElementById('editCurrentImg').src = p.image;
    document.getElementById('editUploadProgress').style.display = 'none';
    document.getElementById('editUploadStatus').style.display = 'none';
    editImageUrl = p.image; // start with current image

    document.getElementById('editModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  window.closeEditModal = function() {
    document.getElementById('editModal').classList.remove('open');
    document.body.style.overflow = '';
  };

  // Replace image in edit modal
  document.getElementById('editImageFile').addEventListener('change', function() {
    if (this.files[0]) uploadEditImage(this.files[0]);
  });

  async function uploadEditImage(file) {
    const progress = document.getElementById('editUploadProgress');
    const bar = document.getElementById('editUploadBar');
    const status = document.getElementById('editUploadStatus');
    progress.style.display = 'block'; status.style.display = 'block';
    status.style.color = '#856404'; status.textContent = '⏳ Uploading…';
    editImageUrl = '';
    try {
      const result = await SupabaseManager.uploadImage(file, pct => { bar.style.width = pct + '%'; });
      editImageUrl = result.url;
      document.getElementById('editCurrentImg').src = editImageUrl;
      bar.style.width = '100%';
      status.style.color = '#155724'; status.textContent = '✅ Image updated!';
    } catch(e) {
      status.style.color = '#721c24'; status.textContent = '❌ ' + e.message;
    }
  }

  document.getElementById('saveEditBtn').addEventListener('click', async () => {
    const id = parseInt(document.getElementById('editId').value);
    const isDefault = document.getElementById('editIsDefault').value === '1';
    const name = document.getElementById('editName').value.trim();
    const category = document.getElementById('editCategory').value;
    const desc = document.getElementById('editDesc').value.trim();
    const price = parseFloat(document.getElementById('editPrice').value) || 0;
    const badge = document.getElementById('editBadge').value.trim() || null;

    if (!name) return showMsg(false, 'Please enter a product name.');
    if (!category) return showMsg(false, 'Please select a category.');

    const btn = document.getElementById('saveEditBtn');
    btn.disabled = true; btn.textContent = '⏳ Saving…';

    // Update price
    savedPrices[id] = price;

    if (isDefault) {
      // Store default overrides in customProducts (use same id to override)
      const existingOverride = customProducts.findIndex(p => p.id === id);
      const updated = { id, name, description: desc, category, image: editImageUrl, price, badge, _overridesDefault: true };
      if (existingOverride >= 0) customProducts[existingOverride] = updated;
      else customProducts.push(updated);
    } else {
      const idx = customProducts.findIndex(p => p.id === id);
      if (idx >= 0) customProducts[idx] = { ...customProducts[idx], name, description: desc, category, image: editImageUrl, price, badge };
    }

    const [pr, cr] = await Promise.all([
      SupabaseManager.savePrices(savedPrices),
      SupabaseManager.saveCustomProducts(customProducts)
    ]);

    closeEditModal();
    showMsg(pr.ok, `"${name}" updated! ✅`);
    renderManageGrid();
    btn.disabled = false; btn.textContent = '💾 Save Changes';
  });

  // ===== DELETE PRODUCT =====
  window.deleteProduct = async function(id, isDefault) {
    const p = allProducts().find(x => x.id === id);
    if (!confirm(`Remove "${p?.name}" from your store?`)) return;

    if (isDefault) {
      // Hide default product
      deletedDefaults.push(id);
      try { localStorage.setItem('bbz_deleted_defaults', JSON.stringify(deletedDefaults)); } catch {}
      // Also remove any override
      customProducts = customProducts.filter(p => p.id !== id);
    } else {
      customProducts = customProducts.filter(p => p.id !== id);
    }
    delete savedPrices[id];

    await Promise.all([
      SupabaseManager.savePrices(savedPrices),
      SupabaseManager.saveCustomProducts(customProducts)
    ]);

    showMsg(true, 'Product removed from store.');
    renderManageGrid();
  };

  // ===== ADD NEW PRODUCT =====
  let addImageUrl = '';

  document.getElementById('addImageFile').addEventListener('change', function() {
    if (this.files[0]) {
      const reader = new FileReader();
      reader.onload = e => {
        const prev = document.getElementById('addUploadPreview');
        prev.src = e.target.result; prev.style.display = 'block';
      };
      reader.readAsDataURL(this.files[0]);
      uploadAddImage(this.files[0]);
    }
  });

  async function uploadAddImage(file) {
    const progress = document.getElementById('addUploadProgress');
    const bar = document.getElementById('addUploadBar');
    const status = document.getElementById('addUploadStatus');
    progress.style.display = 'block'; status.style.display = 'block';
    status.style.color = '#856404'; status.textContent = '⏳ Uploading…';
    addImageUrl = '';
    try {
      const result = await SupabaseManager.uploadImage(file, pct => { bar.style.width = pct + '%'; });
      addImageUrl = result.url;
      bar.style.width = '100%';
      status.style.color = '#155724'; status.textContent = '✅ Image uploaded!';
    } catch(e) {
      status.style.color = '#721c24'; status.textContent = '❌ ' + e.message;
    }
  }

  document.getElementById('addProductBtn').addEventListener('click', async () => {
    const name = document.getElementById('newName').value.trim();
    const category = document.getElementById('newCategory').value;
    const desc = document.getElementById('newDesc').value.trim();
    const price = parseFloat(document.getElementById('newPrice').value) || 0;
    const badge = document.getElementById('newBadge').value.trim() || null;

    if (!name) return showMsg(false, 'Please enter a product name.');
    if (!category) return showMsg(false, 'Please select a category.');
    if (!addImageUrl) return showMsg(false, 'Please upload a product image first.');

    const btn = document.getElementById('addProductBtn');
    btn.disabled = true; btn.textContent = '⏳ Adding…';

    const newId = Date.now();
    customProducts.push({ id: newId, name, description: desc, category, image: addImageUrl, price, badge });
    savedPrices[newId] = price;

    const [pr, cr] = await Promise.all([
      SupabaseManager.savePrices(savedPrices),
      SupabaseManager.saveCustomProducts(customProducts)
    ]);

    if (cr.ok) {
      showMsg(true, `"${name}" added to store! ✅`);
      document.getElementById('newName').value = '';
      document.getElementById('newCategory').value = '';
      document.getElementById('newDesc').value = '';
      document.getElementById('newPrice').value = '';
      document.getElementById('newBadge').value = '';
      document.getElementById('addUploadPreview').style.display = 'none';
      document.getElementById('addUploadProgress').style.display = 'none';
      document.getElementById('addUploadStatus').style.display = 'none';
      document.getElementById('addImageFile').value = '';
      addImageUrl = '';
      renderManageGrid();
      // Switch to manage tab
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelector('[data-tab="manage"]').classList.add('active');
      document.getElementById('tab-manage').classList.add('active');
    } else {
      showMsg(false, cr.msg);
    }
    btn.disabled = false; btn.textContent = '➕ Add Product to Store';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ESC closes modal
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditModal(); });
  document.getElementById('editModal').addEventListener('click', e => {
    if (e.target === document.getElementById('editModal')) closeEditModal();
  });

  function showMsg(ok, msg) {
    const el = document.getElementById('savedMsg');
    el.textContent = (ok ? '✅ ' : '⚠️ ') + msg;
    el.style.display = 'block';
    el.style.background = ok ? '#d4edda' : '#fff3cd';
    el.style.color = ok ? '#155724' : '#856404';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, 5000);
  }

  init();
</script>
</body>
</html>
