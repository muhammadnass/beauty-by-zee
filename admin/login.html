<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Beauty by Zee</title>
  <link rel="icon" href="../images/icon-32.png">
  <link rel="apple-touch-icon" href="../images/icon-180.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    .admin-logo h1 { font-family: 'Playfair Display', Georgia, serif; }
    .admin-login-card { animation: scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .admin-logo img { animation: float 5s ease-in-out infinite; }
  </style>
</head>
<body>

<div class="admin-page">
  <div class="admin-login-card">
    <div class="admin-logo">
      <img src="../images/logo.jpg" alt="Beauty by Zee"
        style="width:80px;height:80px;border-radius:50%;object-fit:contain;border:2px solid var(--gold-light);box-shadow:0 0 24px rgba(201,168,76,0.3)">
      <h1 style="margin-top:0.8rem">Beauty <span>by Zee</span></h1>
      <p>🔐 Admin Portal</p>
    </div>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username" autofocus>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
    </div>

    <button class="login-btn" id="loginBtn">Sign In →</button>

    <div class="login-error" id="loginError">
      ⚠️ Invalid username or password
    </div>

    <div style="text-align:center;margin-top:1.5rem">
      <a href="../index.html" style="color:var(--text-light);font-size:0.85rem;text-decoration:none">← Back to Store</a>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem('bbz_admin') === 'true') {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('loginBtn').addEventListener('click', login);
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  function login() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const err = document.getElementById('loginError');

    if (user === 'admin' && pass === 'admin') {
      localStorage.setItem('bbz_admin', 'true');
      document.getElementById('loginBtn').textContent = '✓ Logging in…';
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 400);
    } else {
      err.style.display = 'block';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
      setTimeout(() => { err.style.display = 'none'; }, 3000);
    }
  }
</script>

</body>
</html>
